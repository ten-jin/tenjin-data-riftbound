name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Publish release using the tagged commit description
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          git log -1 --format=%b HEAD > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" Riftbound.json \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
